server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Сжатие: JS и CSS уходят в 3–4 раза меньше (важно для мобильного интернета)
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # Манифест приложения (установка на телефон)
  types {
    application/manifest+json webmanifest;
  }
  include /etc/nginx/mime.types;

  # Фото для отметки посещаемости (фронтенд уменьшает их до ~2 МБ, запас на всякий случай) и файлы до 10 МБ
  client_max_body_size 15m;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Запросы не буферизуются на диск — фото не попадает во временные файлы nginx
    proxy_request_buffering off;
    proxy_read_timeout 60s;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
